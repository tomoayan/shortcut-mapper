name: Build Tauri Windows App

on:
  push:
    branches:
      - svelte-rewrite
    paths-ignore:
      - '**.md'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install

      - name: Bump Tauri Version
        shell: bash
        run: |
          jq '.version = "0.0.5-dev.${{ github.run_number }}"' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: dev-build
          releaseName: 'Latest Dev Build'
          releaseBody: 'Automatically built from the latest commit on the svelte-rewrite branch.'
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: false

      - name: Generate and Upload Updater JSON
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd src-tauri/target/release/bundle/nsis/
          ls -la
          
          # Find the generated zip and sig
          ZIP_FILE=$(ls *.zip | head -n 1)
          SIG_FILE=$(ls *.sig | head -n 1)
          
          if [ -z "$ZIP_FILE" ] || [ -z "$SIG_FILE" ]; then
            echo "Error: Missing zip or sig file! Tauri did not generate the updater bundle."
            exit 1
          fi
          
          SIG_CONTENT=$(cat $SIG_FILE)
          VERSION=$(jq -r .version ../../../../../src-tauri/tauri.conf.json)
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          ZIP_URL="https://github.com/tomoayan/shortcut-mapper/releases/download/dev-build/$ZIP_FILE"
          
          cat <<EOF > latest.json
          {
            "version": "$VERSION",
            "notes": "Automated dev build",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "windows-x86_64": {
                "signature": "$SIG_CONTENT",
                "url": "$ZIP_URL"
              }
            }
          }
          EOF
          
          # Upload the assets to the release
          gh release upload dev-build $ZIP_FILE $SIG_FILE latest.json --clobber
